name: Desativar acesso publico ao aplicativo de habitos

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Criar aviso de aplicativo indisponivel
        run: |
          mkdir -p site-offline
          cat > site-offline/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width,initial-scale=1">
              <meta name="robots" content="noindex,nofollow,noarchive">
              <title>Aplicativo desativado</title>
              <style>
                body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:system-ui,-apple-system,sans-serif; background:#fff; color:#222; text-align:center; padding:24px; box-sizing:border-box }
                main { max-width:420px }
                h1 { font-size:1.5rem; margin-bottom:10px }
                p { line-height:1.6; color:#555 }
              </style>
            </head>
            <body><main><h1>Aplicativo desativado</h1><p>Este aplicativo nao esta mais disponivel online.</p></main></body>
          </html>
          HTML
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6
      - name: Enviar pagina de indisponibilidade
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-offline
      - name: Publicar aviso
        id: deployment
        uses: actions/deploy-pages@v5
